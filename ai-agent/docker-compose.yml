version: '3.8'

services:
  gherkin-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/gcp-credentials.json
      - PORT=8080
      - DEBUG=False
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/etc/secrets/gcp-credentials.json:ro
      - ./uploads:/app/uploads
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
